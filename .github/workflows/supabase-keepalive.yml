name: Supabase keepalive (read-only)

# Один лёгкий read-only запрос в сутки, чтобы Free-проект Supabase не уходил в паузу.
on:
  schedule:
    - cron: "17 6 * * *" # ежедневно 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Health-check (GET, без изменения данных)
        run: |
          URL="${{ vars.KEEPALIVE_URL || 'https://electric-9117335567.lovable.app/api/public/supabase-keepalive' }}"
          echo "Ping $URL"
          curl -fsS --max-time 30 "$URL" | tee /tmp/keepalive.json
          grep -q '"ok":true' /tmp/keepalive.json
