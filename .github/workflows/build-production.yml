name: Build production Node server

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NITRO_PRESET: node_server
      SUPABASE_URL: https://nppincxonqwajdoxqbla.supabase.co
      SUPABASE_PROJECT_ID: nppincxonqwajdoxqbla
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify production output
        run: |
          test -f .output/server/index.mjs
          test -f .output/nitro.json
          echo "Production build OK"
          du -sh .output

      - name: Check Lovable is absent from production bundle
        run: |
          if grep -RniE 'lovable|lovable\.dev' .output --exclude='*.map'; then
            echo "ERROR: Lovable reference found in production bundle"
            exit 1
          fi
          echo "No Lovable reference in production bundle"

      - name: Package production
        run: |
          cd .output
          tar -czf ../sm-electric-node-production.tar.gz .

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm-electric-node-production
          path: sm-electric-node-production.tar.gz
          retention-days: 7
